name: Compatibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  image:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onvif-compat-test rtsp_to_onvif
      - name: Test built-in snapshot in the image
        run: >-
          docker run --rm --network none --entrypoint node
          -v "$PWD:/checks:ro" onvif-compat-test
          /checks/tests/image-snapshot-smoke.cjs
      - name: Test RTSP debug forwarding in the image
        run: >-
          docker run --rm --network none --entrypoint node
          -v "$PWD:/checks:ro" onvif-compat-test
          /checks/tests/image-rtsp-smoke.cjs
      - name: Test copy-only restream and service lifecycle in the image
        run: >-
          docker run --rm --network none --entrypoint node
          -v "$PWD:/checks:ro" onvif-compat-test
          /checks/tests/image-restream-smoke.cjs
